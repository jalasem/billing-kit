services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: billing_kit
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing -d billing_kit"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - billing_kit_postgres_data:/var/lib/postgresql/data

volumes:
  billing_kit_postgres_data:
